[project]
name = "forecastlab"
version = "0.1.0"
description = "Retail Demand Forecasting Platform (M5 / Walmart data)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # torch 2.2.x is the last release with Intel-macOS wheels and is built against numpy 1.x
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    "pyarrow>=15",
    "pyyaml>=6",
    "scipy>=1.13",
    "scikit-learn>=1.5,<1.6",
    "statsmodels>=0.14",
    "statsforecast>=1.7",
    "prophet>=1.1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1,<2.2",
    "shap>=0.46,<0.47",
    "numba>=0.60,<0.61",  # last line with Intel-macOS wheels
    "torch==2.2.2",
    "chronos-forecasting>=1.4",
    "transformers>=4.48,<4.57",  # 4.57+ / 5.x need torch>=2.5 (no Intel-macOS wheels)
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "streamlit>=1.38",
    "plotly>=5.22",
    "anthropic>=0.69",
    "joblib>=1.4",
    "httpx>=0.27",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecastlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Linux (Docker) installs CPU-only torch; the default PyPI wheel bundles CUDA (~2.5 GB).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
